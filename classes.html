<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>MIR4 Top by class</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;800&display=swap">
<style>
body{font-family:system-ui,sans-serif;margin:0;background:#120a14;color:#f2e8f2}a{color:#f472b6}
header{padding:14px 18px;background:#1c1020;border-bottom:1px solid #3a2040;display:flex;justify-content:space-between;align-items:center}h1{margin:0;font-size:18px}
header a{color:#e8c872;font-weight:700;font-size:13px;text-decoration:none}
.ico{display:inline-block;width:1.05em;height:1.05em;vertical-align:-.15em;background:currentColor;-webkit-mask:var(--i) center/contain no-repeat;mask:var(--i) center/contain no-repeat}
#w{padding:8px 10px 20px;max-width:640px;margin:0 auto}
.fb{display:flex;gap:6px;overflow-x:auto;margin:4px 0 10px;padding-bottom:2px}.fb button{display:flex;align-items:center;gap:5px;background:#1a0f1e;border:1px solid #3a2040;border-radius:999px;color:#e8dcea;padding:5px 10px 5px 6px;font-size:12px;cursor:pointer;white-space:nowrap}.fb button img{width:22px;height:22px}.fb button.on{border-color:#e8c872;color:#e8c872;font-weight:700;background:#2a2410}.fb .al{padding:5px 12px}
.sec h2{display:flex;align-items:center;gap:8px;font-size:16px;margin:14px 2px 8px}.sec h2 img{width:34px;height:34px}.sec h2 small{color:#b9a3bd;font-weight:400;font-size:12px}
.r{display:grid;grid-template-columns:28px 1fr auto;gap:8px;align-items:center;background:#1c1020;border:1px solid #3a2040;border-radius:12px;margin:0 0 8px;padding:10px}.r.u{border-color:#8a6410}
.rk{width:28px;height:28px;line-height:28px;border-radius:50%;background:#3a2040;text-align:center;font-weight:800;font-size:13px}.rk.g{background:#f5c518;color:#1a1300}
.n{font-weight:700;font-size:15px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.n a{color:#e8c872;text-decoration:underline dotted rgba(232,200,114,.5);text-underline-offset:3px}
.m{color:#b9a3bd;font-size:12px;margin-top:3px;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.hc{border:1px solid #5a3a60;border-radius:999px;padding:2px 8px;font-size:11px}
.p{text-align:right;white-space:nowrap}.p b{font-size:16px}.p small{display:block;color:#b9a3bd;font-size:11px}.pos{color:#ffc94d}.neg{color:#f87171}
.ex{color:#b9a3bd;font-size:12px;margin:0 2px 6px}.em{color:#b9a3bd;font-size:13px;padding:6px 2px}
footer{font-size:11px;color:#8a7290;padding:10px 18px 40px}
/* Spirit Summoner theme */
h1,h2,h3,.card>summary,.cd>summary{font-family:'Cinzel',Georgia,serif;letter-spacing:.03em}
header{position:relative;isolation:isolate;min-height:300px;box-sizing:border-box;background:linear-gradient(180deg,rgba(194,24,91,.18),rgba(18,10,20,0));border-bottom:1px solid transparent;border-image:linear-gradient(90deg,transparent,#e8c872,transparent) 1}
header h1{display:flex;align-items:center;gap:10px;background:linear-gradient(90deg,#ffe08a,#f472b6);-webkit-background-clip:text;background-clip:text;color:transparent;text-shadow:0 0 18px rgba(236,72,153,.35)}
.card,.cd{background:rgba(32,14,36,.72);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);border:1px solid rgba(236,72,153,.35);box-shadow:0 0 0 1px rgba(232,200,114,.08) inset,0 6px 22px rgba(0,0,0,.45),0 0 14px rgba(236,72,153,.12)}
.cd[open],.card:hover{border-color:rgba(232,200,114,.55);box-shadow:0 0 0 1px rgba(232,200,114,.12) inset,0 0 20px rgba(236,72,153,.28)}
hr{border:0;height:1px;background:linear-gradient(90deg,transparent,#e8c872,transparent)}
button{transition:box-shadow .2s,transform .1s}
button:hover{box-shadow:0 0 14px rgba(236,72,153,.6),0 0 0 1px rgba(232,200,114,.5)}
button:active{transform:scale(.98)}
a{color:#f472b6}a:hover{color:#ffe08a;text-shadow:0 0 8px rgba(236,72,153,.6)}
header::before{content:"";position:absolute;left:0;right:0;top:0;height:420px;z-index:-1;pointer-events:none;background:linear-gradient(90deg,rgba(18,10,20,.85) 0%,rgba(18,10,20,.35) 45%,transparent 70%),url(icons/banner.jpg?v=1) right 20% center/cover no-repeat;opacity:.45;-webkit-mask-image:linear-gradient(180deg,#000 55%,transparent 100%);mask-image:linear-gradient(180deg,#000 55%,transparent 100%)}
@media (max-width:700px){header::before{height:340px;background-image:linear-gradient(90deg,rgba(18,10,20,.8) 0%,rgba(18,10,20,.3) 50%,transparent 75%),url(icons/banner-m.jpg?v=1);background-position:center,72% center;opacity:.5}header{min-height:240px}}
@keyframes fall{to{transform:translate(-60px,110vh) rotate(540deg)}}
:where(body>header,body>main,body>section,body>#app,body>.wrap){position:relative;z-index:1}
</style></head><body>
<header><h1>🏆 Top by class</h1><a href="index.html">← Top 10</a></header>
<div id="w"><div class="fb" id="fb"></div><div class="ex">Same strength score as the Top 10, under $25k, listed now. Tap a name to open the character.</div><div id="out" class="em">Loading…</div></div>
<footer><a href="changelog.html" style="color:#e8c872;font-weight:700">✨ What's new</a></footer>
<script src="strength.js?v=1"></script><script src="age.js?v=2"></script>
<script>
const CL=['Taoist','Arbalist','Warrior','Lancer'];
const f=n=>n==null?'–':Number(n).toLocaleString(undefined,{maximumFractionDigits:0});
const I=n=>`<i class="ico" style="--i:url(icons/ui/${n}.svg)"></i>`;
const ci=c=>`<img src="icons/class/${c.toLowerCase()}.webp" alt="${c}" title="${c}">`;
const J=u=>fetch(u+'?'+Date.now()).then(r=>r.ok?r.json():{}).catch(()=>({}));
let D,sel=new URLSearchParams(location.search).get('c')||localStorage.mir4cls||'All';if(sel!='All'&&!CL.includes(sel))sel='All';
function rl(x){const r=x.rl;if(!r)return '';const du=Math.round(Math.abs(r.to-r.from)*D.wemix_usd);
 if(r.pct<0)return `<span class="hc" style="border-color:#c99a1e;color:#ffe08a" title="Price cut ${-r.pct}%">${I('repeat')} 🔥 ↓ $${f(du)} · ${f(r.from)}→${f(r.to)}</span>`;
 if(r.pct>0)return `<span class="hc" style="border-color:#dc2626;color:#fca5a5" title="Price raised ${r.pct}%">${I('repeat')} ↑ $${f(du)} · ${f(r.from)}→${f(r.to)}</span>`;
 return `<span class="hc" title="Relisted, same price">${I('repeat')} ${r.relists||''}x</span>`}
const row=(x,i)=>`<div class="r${x.discount>0?' u':''}"><div class="rk${i<3?' g':''}">${i+1}</div><div style="min-width:0"><div class="n"><a href="index.html?char=${encodeURIComponent(x.id)}">${x.name}</a></div><div class="m"><span>⚡ ${f(x.ps)}</span><span>${I('gauge')} ${x.build_score}</span>${AGE.chip(x)}${rl(x)}</div>${AGE.badges(x)?'<div>'+AGE.badges(x)+'</div>':''}</div><div class="p"><b>$${f(x.usd)}</b><small>${f(x.wemix)} W</small><small class="${x.discount>0?'pos':'neg'}">${x.discount==null?'':x.discount>0?'▼ '+x.discount+'% under':'▲ '+(-x.discount)+'% over'}</small></div></div>`;
function render(){fb.innerHTML=`<button class="al${sel=='All'?' on':''}" data-c="All">All</button>`+CL.map(c=>`<button data-c="${c}" class="${sel==c?'on':''}">${ci(c)}${c}</button>`).join('');
 fb.querySelectorAll('button').forEach(b=>b.onclick=()=>{sel=b.dataset.c;localStorage.mir4cls=sel;render()});
 const R=T20S.score(D.listings,T20S.pick(D.listings));const n=sel=='All'?3:10;
 out.className='';out.innerHTML=(sel=='All'?CL:[sel]).map(c=>{const L=R.filter(x=>x.cls==c).slice(0,n);
  return `<div class="sec"><h2>${ci(c)}${c} <small>top ${n}</small></h2>${L.length?L.map(row).join(''):'<div class="em">None listed under $25k right now.</div>'}</div>`}).join('')}
Promise.all([J('data.json'),J('data/relist.json')]).then(([d,r])=>{D=d;const RB=r.by_id||{};document.querySelector('.ex').insertAdjacentHTML('beforeend',' '+AGE.note(d));D.listings.forEach(x=>x.rl=RB[x.id]||null);render()});
</script></body></html>
