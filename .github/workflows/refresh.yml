name: refresh-data
on:
  schedule: [{cron: "17,47 * * * *"}]  # every 30 min; sealed character details are cached, so each run mostly re-reads list pages
  workflow_dispatch:
concurrency: {group: refresh-data, cancel-in-progress: false}
permissions: {contents: write}
jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install numpy pillow
      - run: python3 scrape.py
      - run: python3 wemix.py || true  # hourly WEMIX/USD point (skips if <55 min since last)
      - run: python3 snapshots.py  # full details of every live listing -> data/snaps/<id>.json, kept after it sells
      - run: python3 archive.py  # append new sales to display-only sold history
      - run: |
          git config user.name "mir4-bot"; git config user.email "actions@users.noreply.github.com"
          git add data.json data cache/features.json cache/xdetail.json cache/icons.json cache/stones.json icons && git commit -m "Refresh data $(date -u +%F)" && (git push || (git pull --rebase -q && git push)) || echo "no changes"
