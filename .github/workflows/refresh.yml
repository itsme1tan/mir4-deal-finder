name: refresh-data
on:
  schedule: [{cron: "30 14 * * *"}]
  workflow_dispatch:
permissions: {contents: write}
jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install numpy pillow
      - run: python3 scrape.py
      - run: |
          git config user.name "mir4-bot"; git config user.email "actions@users.noreply.github.com"
          git add data.json data cache/features.json cache/icons.json icons && git commit -m "Refresh data $(date -u +%F)" && git push || echo "no changes"
